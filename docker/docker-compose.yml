version: '3.9'

x-common-variables: &common-variables
  DATABASE_URL: postgresql://complianceguard:${DB_PASSWORD:-secure_password}@postgres:5432/complianceguard
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
  LANDING_AI_API_KEY: ${LANDING_AI_API_KEY}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  ENVIRONMENT: ${ENVIRONMENT:-development}

services:
  postgres:
    image: postgres:15-alpine
    container_name: complianceguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: complianceguard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: complianceguard
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U complianceguard"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - complianceguard-network

  redis:
    image: redis:7-alpine
    container_name: complianceguard-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - complianceguard-network

  minio:
    image: minio/minio:latest
    container_name: complianceguard-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - complianceguard-network

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: complianceguard-api
    restart: unless-stopped
    volumes:
      - ../src:/app/src:ro
      - ../migrations:/app/migrations:ro
      - api_logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      <<: *common-variables
      SERVICE_NAME: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - complianceguard-network

  celery-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: complianceguard-celery-worker
    restart: unless-stopped
    command: celery -A complianceguard.tasks.celery_app worker --loglevel=${LOG_LEVEL:-info} --concurrency=4
    volumes:
      - ../src:/app/src:ro
      - celery_logs:/app/logs
    environment:
      <<: *common-variables
      SERVICE_NAME: celery-worker
      CELERY_WORKER_POOL: ${CELERY_WORKER_POOL:-prefork}
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - complianceguard-network

  celery-beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: complianceguard-celery-beat
    restart: unless-stopped
    command: celery -A complianceguard.tasks.celery_app beat --loglevel=${LOG_LEVEL:-info}
    volumes:
      - ../src:/app/src:ro
      - celery_beat_logs:/app/logs
    environment:
      <<: *common-variables
      SERVICE_NAME: celery-beat
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - complianceguard-network

  flower:
    image: mher/flower:2.0
    container_name: complianceguard-flower
    restart: unless-stopped
    command: celery flower --broker=redis://redis:6379/0 --port=5555
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - complianceguard-network

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: complianceguard-nginx
    restart: unless-stopped
    profiles: ["production"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    networks:
      - complianceguard-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  api_logs:
  celery_logs:
  celery_beat_logs:
  nginx_logs:

networks:
  complianceguard-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16